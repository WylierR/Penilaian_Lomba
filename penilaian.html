<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Penilaian Lomba</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  margin: 0;
  padding: 20px;
}

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 40px;
}

button {
  cursor: pointer;
  border: none;
  border-radius: 10px;
  padding: 10px 18px;
  font-size: 16px;
}

.add-btn {
  background: #4CAF50;
  color: white;
}

.settings-btn {
  background: #333;
  color: white;
  font-size: 20px;
}

/* CENTER AREA */
.center-wrapper {
  display: flex;
  justify-content: center;
}

/* GRID: MAX 3 TEAM PER BARIS */
.teams {
  display: grid;
  grid-template-columns: repeat(3, 300px);
  gap: 30px;
  justify-content: center;
}

/* TEAM CARD */
.team-card {
  background: white;
  border-radius: 22px;
  padding: 18px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.15);
}

/* HEADER TEAM */
.team-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.team-name {
  border: none;
  font-weight: bold;
  font-size: 20px;
  width: 200px;
}

.team-name:focus {
  outline: none;
  border-bottom: 2px solid #aaa;
}

.delete-btn {
  background: none;
  font-size: 20px;
}

/* SCORE */
.score {
  text-align: center;
  font-size: 80px;
  margin: 30px 0;
  font-weight: bold;
}

/* CONTROLS */
.controls {
  display: flex;
  gap: 10px;
}

.controls button {
  flex: 1;
  font-size: 36px;
  padding: 18px 0;
  color: white;
  border-radius: 16px;
}

/* WARNA BUTTON */
.btn-minus {
  background: #e53935;
}

.btn-plus {
  background: #43a047;
}

/* POPUP */
.popup {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.45);
  display: none;
  justify-content: center;
  align-items: center;
}

.popup-content {
  background: white;
  padding: 28px;
  border-radius: 14px;
  width: 320px;
  box-sizing: border-box;
}

.popup-content label {
  display: block;
  margin-top: 12px;
  margin-bottom: 6px;
  font-weight: 500;
}

.popup-content input {
  width: 100%;
  padding: 10px 12px;
  font-size: 16px;
  box-sizing: border-box;
  border-radius: 8px;
  border: 1px solid #ccc;
}

.popup-content button {
  margin-top: 18px;
  padding: 10px 16px;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="header">
  <button class="add-btn" onclick="addTeam()">Tambah Team</button>
  <button class="settings-btn" onclick="openSettings()">⚙️</button>
</div>

<div class="center-wrapper">
  <div class="teams" id="teams"></div>
</div>

<!-- POPUP PENGATURAN -->
<div class="popup" id="popup">
  <div class="popup-content">
    <h3>Pengaturan Point</h3>
    <label>Point Penambahan / Pengurangan</label>
    <input type="number" id="pointValue" value="10" min="1">
    <br><br>
    <button onclick="saveSettings()">Simpan</button>
  </div>
</div>

<script>
let pointStep = 10;
let teamCount = 1;

function addTeam() {
  const teams = document.getElementById('teams');

  const card = document.createElement('div');
  card.className = 'team-card';

  card.innerHTML = `
    <div class="team-header">
      <input class="team-name" value="Team ${teamCount++}">
      <button class="delete-btn" onclick="this.closest('.team-card').remove()">🗑️</button>
    </div>
    <div class="score">0</div>
    <div class="controls">
      <button class="btn-minus" onclick="changeScore(this, -1)">−</button>
      <button class="btn-plus" onclick="changeScore(this, 1)">+</button>
    </div>
  `;

  teams.appendChild(card);
}

function changeScore(btn, direction) {
  const scoreEl = btn.closest('.team-card').querySelector('.score');
  let score = parseInt(scoreEl.textContent);
  score += direction * pointStep;
  if (score < 0) score = 0;
  scoreEl.textContent = score;
}

function openSettings() {
  document.getElementById('popup').style.display = 'flex';
}

function saveSettings() {
  const value = parseInt(document.getElementById('pointValue').value);
  if (value > 0) pointStep = value;
  document.getElementById('popup').style.display = 'none';
}
</script>

</body>
</html>
